name: Sentinel

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

jobs:
    sentinel:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Download Sentinel
              run: |
                  curl -L https://github.com/jakeeviado/sentinel/releases/latest/download/sentinel-linux-amd64 -o sentinel
                  chmod +x sentinel

            - name: Scan Code (Enforcement)
              run: ./sentinel scan --path .

            - name: Collect Training Data
              if: always()
              run: |
                  ./sentinel scan --path ./training-sets/ai --verbose --collect --label ai
                  ./sentinel scan --path ./training-sets/human --verbose --collect --label human

            - name: Upload Training Data Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: sentinel-training-csv
                  path: sentinel_training.csv
